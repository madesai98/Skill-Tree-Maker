          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('src/playtest.ts')
          text = p.read_text()
          marker = "export function canUnlockPlaytestNode(\n"
          helper = '''const incomingEdgeCache = new WeakMap<readonly PlaytestEdge[], ReadonlyMap<string, readonly string[]>>();\nconst outgoingEdgeCache = new WeakMap<readonly PlaytestEdge[], ReadonlyMap<string, readonly string[]>>();\n\nfunction endpointIndex(edges: readonly PlaytestEdge[], direction: 'incoming' | 'outgoing') {\n  const cache = direction === 'incoming' ? incomingEdgeCache : outgoingEdgeCache;\n  const cached = cache.get(edges);\n  if (cached) return cached;\n  const mutable = new Map<string, string[]>();\n  for (const edge of edges) {\n    const key = direction === 'incoming' ? edge.target : edge.source;\n    const value = direction === 'incoming' ? edge.source : edge.target;\n    const list = mutable.get(key);\n    if (list) list.push(value);\n    else mutable.set(key, [value]);\n  }\n  cache.set(edges, mutable);\n  return mutable;\n}\n\n'''
          if marker not in text:
              raise SystemExit('playtest marker missing')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace("  return edges.every((edge) => edge.target !== nodeId || unlockedNodeIds.has(edge.source));", "  return (endpointIndex(edges, 'incoming').get(nodeId) ?? []).every((source) => unlockedNodeIds.has(source));", 1)
          text = text.replace("  return !edges.some((edge) => edge.source === nodeId && unlockedNodeIds.has(edge.target));", "  return !(endpointIndex(edges, 'outgoing').get(nodeId) ?? []).some((target) => unlockedNodeIds.has(target));", 1)
          p.write_text(text)
          PY

