name: Temporary zoom 0.02 patch
run-name: Apply 0.02 zoom limit

on:
  push:
    branches: [zoom-out-002-20260909]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: zoom-out-002-20260909
          fetch-depth: 0

      - name: Update minimum zoom
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = '                minZoom={0.1}\n'
          new = '                minZoom={0.02}\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one minZoom 0.1 occurrence, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temp-zoom-002.yml

      - name: Commit change and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/temp-zoom-002.yml
          git commit -m "Lower skill tree minimum zoom to 0.02"
          git push origin HEAD:zoom-out-002-20260909
