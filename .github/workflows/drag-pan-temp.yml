name: Apply drag and pan performance patch
run-name: Apply drag and pan performance patch

on:
  push:
    branches: [perf/drag-pan-latency]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drag-pan-latency
      - name: Apply interaction performance patch
        run: python .github/drag-pan-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit optimized source and remove temporary files
        shell: bash
        run: |
          rm -f .github/drag-pan-patch.py .github/workflows/drag-pan-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Defer label layout until node drag ends"
          git push origin HEAD:perf/drag-pan-latency
