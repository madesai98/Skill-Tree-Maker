name: Apply and Validate Online Mode Fixes

on:
  push:
    branches: [feature/firebase-online-projects]
    paths:
      - .github/workflows/apply-online-mode-fixes.yml

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify expected source blobs
        shell: bash
        run: |
          test "$(git hash-object src/history.ts)" = "f5d551a05054a9c6a4e2fa41ed7b19f422ba74d7"
          test "$(git hash-object src/projectRuntime.ts)" = "6e1cb2620631c7d7c1bc75ac12eeaced6956ea04"

      - name: Apply tested fix patch
        shell: bash
        run: |
          : > /tmp/online-mode-fixes.b64
          printf '%s' '' >> /tmp/online-mode-fixes.b64
          printf '%s' '' >> /tmp/online-mode-fixes.b64
          printf '%s' '' >> /tmp/online-mode-fixes.b64
          printf '%s' '' >> /tmp/online-mode-fixes.b64
          base64 -d /tmp/online-mode-fixes.b64 > /tmp/online-mode-fixes.patch
          git apply --check /tmp/online-mode-fixes.patch
          git apply /tmp/online-mode-fixes.patch
          test "$(git hash-object src/history.ts)" = "fd516b747a1319e8eba812a26334ec10bdd58ddf"
          test "$(git hash-object src/projectRuntime.ts)" = "4e61225dee8eecc57627fc4354c6e6178dd1ace6"

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-online-mode-fixes.yml
          git add src/history.ts src/projectRuntime.ts .github/workflows/apply-online-mode-fixes.yml
          git diff --cached --check
          git commit -m "Queue collaborative cloud edits safely"
          git push origin HEAD:feature/firebase-online-projects
