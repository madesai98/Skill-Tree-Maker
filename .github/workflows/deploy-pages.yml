name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Smoke test production output
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/skill-tree-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Skill-Tree-Maker/ -o /tmp/skill-tree-index.html; then
              READY=1
              break
            fi
            sleep 0.5
          done
          test "$READY" = "1"
          test -s /tmp/skill-tree-index.html
          grep -q '/Skill-Tree-Maker/assets/' /tmp/skill-tree-index.html

          python - <<'PY' > /tmp/skill-tree-asset-path
          from pathlib import Path
          import re
          html = Path('/tmp/skill-tree-index.html').read_text()
          match = re.search(r'["\x27](/Skill-Tree-Maker/assets/[^"\x27]+)["\x27]', html)
          if not match:
              raise SystemExit('No built asset URL found in preview HTML')
          print(match.group(1))
          PY

          ASSET=$(cat /tmp/skill-tree-asset-path)
          test -n "$ASSET"
          curl --fail --silent --show-error "http://127.0.0.1:4173${ASSET}" -o /dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
