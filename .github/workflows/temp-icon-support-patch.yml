name: Temporary icon support patch
on:
  push:
    branches: [feat/reusable-svg-icon-pool]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reusable-svg-icon-pool
          fetch-depth: 0
      - name: Patch cloud history and style imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def patch(path, reps):
            p=Path(path); t=p.read_text()
            for old,new in reps:
              c=t.count(old)
              if c != 1: raise SystemExit(f'{path}: match {c}: {old[:120]!r}')
              t=t.replace(old,new,1)
            p.write_text(t)

          patch('src/cloudStore.ts', [
            ("        : collection === 'currencies'\n          ? 'currency'\n          : null;", "        : collection === 'currencies'\n          ? 'currency'\n          : collection === 'icons'\n            ? 'icon'\n            : null;"),
            ("  collectionName: 'nodes' | 'edges' | 'stats' | 'currencies',", "  collectionName: 'nodes' | 'edges' | 'stats' | 'currencies' | 'icons',"),
            ("  const collections = ['nodes', 'edges', 'stats', 'currencies'] as const;", "  const collections = ['nodes', 'edges', 'stats', 'currencies', 'icons'] as const;"),
          ])
          patch('src/history.ts', [
            ("  if (structural('currencies', true)) return 'Added currency';\n  if (structural('currencies', false)) return 'Removed currency';", "  if (structural('currencies', true)) return 'Added currency';\n  if (structural('currencies', false)) return 'Removed currency';\n  if (structural('icons', true)) return 'Added icon';\n  if (structural('icons', false)) return 'Removed icon';"),
            ("  if (changes.some((change) => change.key[0] === 'currencies')) return 'Edited currencies';\n  if (changes.some((change) => change.key[0] === 'nodes')) return 'Edited skill';", "  if (changes.some((change) => change.key[0] === 'currencies')) return 'Edited currencies';\n  if (changes.some((change) => change.key[0] === 'icons')) return 'Edited icon pool';\n  if (changes.some((change) => change.key[0] === 'nodes')) return 'Edited skill';"),
          ])
          patch('src/main.tsx', [
            ("import './nodeLabels.css';\nimport App from './App';", "import './nodeLabels.css';\nimport './iconPool.css';\nimport App from './App';"),
          ])
          PY
      - name: Commit support patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/cloudStore.ts src/history.ts src/main.tsx
          git commit -m "Integrate icon pool with cloud and history"
          git push origin HEAD:feat/reusable-svg-icon-pool
