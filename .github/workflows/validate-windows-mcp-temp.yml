name: Temporary Windows MCP validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-windows-command:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tunnel-client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/openai/tunnel-client/releases/latest' -Headers @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'Skill-Tree-Maker-CI' }
          $asset = $release.assets | Where-Object { $_.name -eq "tunnel-client-$($release.tag_name)-windows-amd64.zip" } | Select-Object -First 1
          if (-not $asset) { throw 'Latest tunnel-client release has no windows-amd64 ZIP.' }
          $zip = Join-Path $env:RUNNER_TEMP 'tunnel-client.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'tunnel-client'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter 'tunnel-client.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'tunnel-client.exe was not found after extraction.' }
          "TUNNEL_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify PowerShell preserves the MCP command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $relayCommand = 'cmd.exe /d /s /c npx.cmd -y @mcp-b/webmcp-local-relay@5.0.1 --widget-origin https://madesai98.github.io --invoke-timeout 125000'
          $mcpCommandArg = '--mcp-command=' + $relayCommand
          $profileDir = Join-Path $env:RUNNER_TEMP 'profiles'
          $initArgs = @(
            'init',
            '--profile', 'stm-windows-command-test',
            '--profile-dir', $profileDir,
            '--tunnel-id', 'tunnel_0123456789abcdef0123456789abcdef',
            $mcpCommandArg,
            '--force'
          )
          & $env:TUNNEL_EXE @initArgs
          if ($LASTEXITCODE -ne 0) { throw "tunnel-client init failed with exit code $LASTEXITCODE." }
          $profilePath = Join-Path $profileDir 'stm-windows-command-test.yaml'
          $profile = Get-Content -Path $profilePath -Raw
          Write-Host $profile
          if (-not $profile.Contains($relayCommand)) {
            throw 'The generated tunnel-client profile did not preserve the complete MCP command.'
          }
          if ($profile.Contains('C:/Program')) {
            throw 'The generated profile unexpectedly contains a truncated Program Files command.'
          }
