name: Temporary stat group patch
run-name: Apply collapsible and reorderable stat groups

on:
  push:
    branches:
      - feature/stat-group-collapse-reorder

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply stat group patch
        run: python3 .github/scripts/apply-stat-group-collapse-reorder.py

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Remove temporary patch scaffolding
        run: |
          rm .github/scripts/apply-stat-group-collapse-reorder.py
          rm .github/workflows/temp-apply-stat-group-collapse-reorder.yml

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Make stat groups collapsible and reorderable"
          git push origin HEAD:feature/stat-group-collapse-reorder
