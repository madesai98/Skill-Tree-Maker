name: Temporary compact icon picker patch
on:
  push:
    branches: [feat/compact-icon-picker]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compact-icon-picker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace oversized icon selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/iconPool.tsx',
          "import { ChangeEvent, useEffect, useMemo, useState } from 'react';",
          "import { ChangeEvent, useEffect, useMemo, useRef, useState } from 'react';")

          old_picker = '''export function IconPicker({ icons, value, onChange, onUpload, compact = false, ariaLabel = 'Icon' }: IconPickerProps) {
  const selected = icons.find((icon) => icon.id === value) ?? null;
  const onFile = (event: ChangeEvent<HTMLInputElement>) => {
    const file = event.target.files?.[0];
    event.target.value = '';
    if (file) void onUpload(file);
  };

  return (
    <div className={`icon-picker${compact ? ' compact' : ''}`}>
      <SvgAssetPreview icon={selected} />
      <select aria-label={ariaLabel} value={selected?.id ?? ''} onChange={(event) => onChange(event.target.value || null)}>
        <option value="">No icon</option>
        {icons.map((icon) => <option key={icon.id} value={icon.id}>{icon.name}</option>)}
      </select>
      <label className="icon-upload-control" title="Upload SVG">
        <span>{compact ? '+' : 'Upload SVG'}</span>
        <input type="file" accept=".svg,image/svg+xml" onChange={onFile} hidden />
      </label>
    </div>
  );
}'''

          new_picker = '''export function IconPicker({ icons, value, onChange, onUpload, compact = false, ariaLabel = 'Icon' }: IconPickerProps) {
  const selected = icons.find((icon) => icon.id === value) ?? null;
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const rootRef = useRef<HTMLDivElement>(null);
  const fileRef = useRef<HTMLInputElement>(null);
  const filteredIcons = useMemo(() => {
    const search = query.trim().toLowerCase();
    if (!search) return icons;
    return icons.filter((icon) => icon.name.toLowerCase().includes(search));
  }, [icons, query]);

  useEffect(() => {
    if (!open) return;
    const closeOnOutsidePointer = (event: PointerEvent) => {
      if (!rootRef.current?.contains(event.target as Node)) setOpen(false);
    };
    const closeOnEscape = (event: KeyboardEvent) => {
      if (event.key === 'Escape') setOpen(false);
    };
    window.addEventListener('pointerdown', closeOnOutsidePointer, true);
    window.addEventListener('keydown', closeOnEscape, true);
    return () => {
      window.removeEventListener('pointerdown', closeOnOutsidePointer, true);
      window.removeEventListener('keydown', closeOnEscape, true);
    };
  }, [open]);

  const closePicker = () => {
    setOpen(false);
    setQuery('');
  };

  const chooseIcon = (iconId: string | null) => {
    onChange(iconId);
    closePicker();
  };

  const onFile = (event: ChangeEvent<HTMLInputElement>) => {
    const file = event.target.files?.[0];
    event.target.value = '';
    if (!file) return;
    closePicker();
    void onUpload(file);
  };

  return (
    <div ref={rootRef} className={`icon-picker${compact ? ' compact' : ''}${open ? ' is-open' : ''}`}>
      <button
        type="button"
        className="icon-picker-trigger"
        aria-label={ariaLabel}
        aria-haspopup="dialog"
        aria-expanded={open}
        title={selected?.name ?? 'No icon'}
        onClick={() => setOpen((current) => !current)}
      >
        <SvgAssetPreview icon={selected} />
      </button>

      {open && (
        <div className="icon-picker-dropdown" role="dialog" aria-label={`${ariaLabel} picker`}>
          <div className="icon-picker-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></svg>
            <input
              autoFocus
              type="search"
              value={query}
              placeholder="Search icons…"
              aria-label="Search icon pool"
              onChange={(event) => setQuery(event.target.value)}
            />
          </div>
          <div className="icon-picker-grid" role="listbox" aria-label="Icon pool">
            <button
              type="button"
              className="icon-picker-option icon-picker-add"
              aria-label="Upload new SVG"
              title="Upload new SVG"
              onClick={() => fileRef.current?.click()}
            >
              <span aria-hidden="true">+</span>
            </button>
            <button
              type="button"
              className={`icon-picker-option icon-picker-clear${value ? '' : ' is-selected'}`}
              aria-label="Clear icon"
              title="No icon"
              role="option"
              aria-selected={!value}
              onClick={() => chooseIcon(null)}
            >
              <SvgAssetPreview icon={null} />
            </button>
            {filteredIcons.map((icon) => (
              <button
                type="button"
                className={`icon-picker-option${icon.id === value ? ' is-selected' : ''}`}
                key={icon.id}
                aria-label={icon.name}
                title={icon.name}
                role="option"
                aria-selected={icon.id === value}
                onClick={() => chooseIcon(icon.id)}
              >
                <SvgAssetPreview icon={icon} />
              </button>
            ))}
          </div>
          {filteredIcons.length === 0 && query.trim() && <div className="icon-picker-empty">No matching icons.</div>}
        </div>
      )}

      <input ref={fileRef} type="file" accept=".svg,image/svg+xml" onChange={onFile} hidden />
    </div>
  );
}'''
          replace_once('src/iconPool.tsx', old_picker, new_picker)

          css = Path('src/iconPool.css')
          text = css.read_text()
          start = text.index('.icon-picker {')
          end = text.index('\n\n.stat-group-fields.with-appearance', start)
          new_css = '''.icon-picker {
  position: relative;
  width: 52px;
  height: 52px;
}
.icon-picker-trigger {
  width: 52px;
  height: 52px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: #11151c;
  color: #a9b2bf;
}
.icon-picker-trigger:hover,
.icon-picker.is-open .icon-picker-trigger {
  border-color: rgba(182,255,86,.32);
  background: #151a22;
}
.icon-picker-trigger > .svg-icon-preview {
  width: 100%;
  height: 100%;
  flex-basis: 100%;
  border: 0;
  border-radius: inherit;
  background: transparent;
}
.icon-picker-trigger > .svg-icon-preview img { width: 30px; height: 30px; }
.icon-picker-trigger > .svg-icon-preview.is-empty::before { width: 21px; height: 21px; border-radius: 5px; }
.icon-picker-dropdown {
  position: absolute;
  z-index: 80;
  top: calc(100% + 7px);
  left: 0;
  width: min(292px, calc(100vw - 32px));
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: #0d1117;
  box-shadow: 0 18px 50px rgba(0,0,0,.48);
}
.icon-picker-search {
  position: relative;
  z-index: 2;
  padding: 9px;
  border-bottom: 1px solid var(--line);
  background: #0d1117;
}
.icon-picker-search svg {
  position: absolute;
  left: 19px;
  top: 19px;
  width: 15px;
  height: 15px;
  fill: none;
  stroke: #707b8a;
  stroke-width: 1.8;
  stroke-linecap: round;
}
.icon-picker-search input { height: 35px; padding-left: 33px; }
.icon-picker-grid {
  max-height: 248px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #303844 transparent;
  padding: 9px;
  display: grid;
  grid-template-columns: repeat(5, 44px);
  gap: 7px;
  align-content: start;
}
.icon-picker-option {
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.075);
  border-radius: 9px;
  background: #11151c;
  color: #8994a3;
}
.icon-picker-option:hover { border-color: rgba(255,255,255,.19); background: #181d25; color: #fff; }
.icon-picker-option.is-selected { border-color: rgba(182,255,86,.55); box-shadow: 0 0 0 2px rgba(182,255,86,.08); }
.icon-picker-option > .svg-icon-preview {
  width: 100%;
  height: 100%;
  flex-basis: 100%;
  border: 0;
  border-radius: inherit;
  background: transparent;
}
.icon-picker-option > .svg-icon-preview img { width: 27px; height: 27px; }
.icon-picker-option > .svg-icon-preview.is-empty::before { width: 19px; height: 19px; border-radius: 5px; }
.icon-picker-add span { font-size: 25px; line-height: 1; font-weight: 500; }
.icon-picker-empty { padding: 0 10px 10px; color: #657080; font-size: 10px; text-align: center; }
.stat-group-card:has(.icon-picker.is-open),
.stat-group-card .stat-table-card:has(.icon-picker.is-open),
.currency-pool-view .stat-table-card:has(.icon-picker.is-open) { overflow: visible; }
'''
          text = text[:start] + new_css + text[end:]
          text = text.replace(
              'grid-template-columns: minmax(140px, 1fr) minmax(160px, 1.1fr) minmax(180px, 1.2fr) 78px;\n  max-width: 900px;',
              'grid-template-columns: minmax(140px, 1fr) minmax(160px, 1.1fr) 62px 78px;\n  max-width: 760px;')
          text = text.replace(
              'grid-template-columns: minmax(150px, 1.15fr) minmax(145px, 1fr) minmax(145px, .9fr) 90px 100px 40px;',
              'grid-template-columns: minmax(150px, 1.15fr) minmax(145px, 1fr) 64px 90px 100px 40px;')
          text = text.replace(
              'grid-template-columns: minmax(150px, 1.15fr) minmax(155px, 1fr) minmax(210px, 1.25fr) 78px 110px 40px;',
              'grid-template-columns: minmax(150px, 1.15fr) minmax(155px, 1fr) 64px 78px 110px 40px;')
          text = text.replace('  .icon-picker { grid-template-columns: 34px minmax(0, 1fr) auto; }\n', '')
          text += '''\n@media (max-width: 420px) {\n  .icon-picker-dropdown { width: min(257px, calc(100vw - 24px)); }\n  .icon-picker-grid { grid-template-columns: repeat(4, 44px); }\n}\n'''
          css.write_text(text)
          PY

      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/iconPool.tsx src/iconPool.css
          git diff --cached --check
          git commit -m "Simplify icon picker dropdown"
          git push origin HEAD:feat/compact-icon-picker
