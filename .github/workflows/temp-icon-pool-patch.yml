ccept=".svg,image/svg+xml" hidden onChange={(event) => { const file = event.target.files?.[0]; event.target.value = ''; if (file) void replaceIconAsset(icon.id, file); }} /></label>\n                        <button className="danger-button" onClick={() => deleteIconAsset(icon.id)}><Icon name="trash" /> Delete</button>\n                      </div>\n                    </div>\n                  </article>\n                );\n              })}\n            </div>\n          )}\n        </section>\n      )}\n    </main>\n  );\n}\n\nexport default App;''')
