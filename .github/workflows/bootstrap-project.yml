name: Bootstrap project source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore uploaded project
        run: |
          python - <<'PY'
          from pathlib import Path

          p1 = Path('project.part.01').read_text()
          assert len(p1) == 8001 and p1[3788] == 'i'
          Path('project.part.01.fixed').write_text(p1[:3788] + p1[3789:])

          p3 = Path('project.part.03').read_text()
          assert len(p3) == 7572 and p3[1608] == 'G'
          Path('project.part.03.fixed').write_text(p3[:1608] + 'H' + p3[1609:])
          PY

          cat project.part.00 project.part.01.fixed project.part.02 project.part.03.fixed | base64 --decode > project.zip
          echo 'b04a80b4584d503c9e8288c5c704c28648963e107b8b83d7dda83e3895da0004  project.zip' | sha256sum -c -
          unzip -t project.zip
          unzip -o project.zip

          # The GitHub Actions token cannot create/update workflow files.
          # Keep this bootstrap workflow unchanged and deploy Pages from /docs instead.
          rm -f .github/workflows/deploy-pages.yml
          rm -f project.zip project.zip.b64 project.part.*

      - name: Build static site into docs
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf docs
          mv dist docs
          touch docs/.nojekyll

      - name: Commit restored source and built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "Restore Skill Tree Maker and publish docs"
          git push origin main
