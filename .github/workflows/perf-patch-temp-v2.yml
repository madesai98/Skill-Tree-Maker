          EOF

          cat > src/nodeLabelLayout.ts <<'EOF'
          export type NodeLabelEffectInput = {
            operator: 'add' | 'subtract' | 'multiply' | 'divide' | 'set';
            value: number | boolean;
            groupName: string;
            statName: string;
          };

          export type NodeLabelInput = {
            id: string;
            position: { x: number; y: number };
            name: string;
            currency: { amount: number; hasIcon: boolean } | null;
            effects: NodeLabelEffectInput[];
          };

          export type NodeLabelEffectView = {
            modifier: string;
            target: string;
            text: string;
            tone: 'positive' | 'negative' | 'neutral';
          };

          export type NodeLabelView = {
            left: number;
            top: number;
            width: number;
            align: 'left' | 'center' | 'right';
            currency: { text: string; hasIcon: boolean } | null;
            name: string | null;
            effects: NodeLabelEffectView[];
          };

          type LayoutEdge = { source: string; target: string };
          type Rect = { left: number; top: number; right: number; bottom: number };
          type Point = { x: number; y: number };
          type Direction = {
            x: number;
            y: number;
            bias: number;
            align: NodeLabelView['align'];
          };
          type SpatialIndex<T> = Map<string, T[]>;

          const NODE_SIZE = 62;
          const NODE_RADIUS = 29;
          const LABEL_GAP = 12;
          const NODE_CLEARANCE = 5;
          const EDGE_CLEARANCE = 4;
          const LABEL_CLEARANCE = 5;
          const SPATIAL_CELL = 192;

          const DIRECTIONS: Direction[] = [
            { x: 1, y: 0, bias: 0, align: 'left' },
            { x: -1, y: 0, bias: 0.05, align: 'right' },
            { x: 0, y: -1, bias: 0.1, align: 'center' },
            { x: 0, y: 1, bias: 0.15, align: 'center' },
            { x: Math.SQRT1_2, y: -Math.SQRT1_2, bias: 0.2, align: 'left' },
            { x: Math.SQRT1_2, y: Math.SQRT1_2, bias: 0.25, align: 'left' },
            { x: -Math.SQRT1_2, y: -Math.SQRT1_2, bias: 0.3, align: 'right' },
            { x: -Math.SQRT1_2, y: Math.SQRT1_2, bias: 0.35, align: 'right' },
          ];

          function formatNumber(value: number) {
            if (!Number.isFinite(value)) return '0';
            if (Math.abs(value) >= 1e6 || (Math.abs(value) > 0 && Math.abs(value) < 1e-4)) return value.toPrecision(4);
            return Number(value.toFixed(6)).toString();
          }

          function formatCurrency(currency: NonNullable<NodeLabelInput['currency']>) {
            return { text: formatNumber(currency.amount), hasIcon: currency.hasIcon };
          }

          function statTarget(groupName: string, statName: string) {
            const group = groupName.trim();
            const stat = statName.trim();
            if (!group) return stat;
            if (!stat) return group;
            const lowerGroup = group.toLocaleLowerCase();
            const lowerStat = stat.toLocaleLowerCase();
            if (lowerStat === lowerGroup) return stat;
            if (lowerStat.startsWith(`${lowerGroup} `)) return `${group} ${stat.slice(group.length).trim()}`;
            return `${group} ${stat}`;
          }

          function formatEffect(effect: NodeLabelEffectInput): NodeLabelEffectView {
            const target = statTarget(effect.groupName, effect.statName);
            let modifier: string;
            let tone: NodeLabelEffectView['tone'] = 'neutral';
            if (effect.operator === 'set') {
              const enabled = Boolean(effect.value);
              modifier = enabled ? '✓' : '✕';
              tone = enabled ? 'positive' : 'negative';
            } else {
              const rawValue = typeof effect.value === 'number' ? effect.value : 0;
              if (effect.operator === 'multiply') modifier = `×${formatNumber(rawValue)}`;
              else if (effect.operator === 'divide') modifier = `÷${formatNumber(rawValue)}`;
              else {
                const signedValue = effect.operator === 'subtract' ? -rawValue : rawValue;
                modifier = `${signedValue >= 0 ? '+' : '−'}${formatNumber(Math.abs(signedValue))}`;
                tone = signedValue >= 0 ? 'positive' : 'negative';
              }
            }
            return { modifier, target, text: `${modifier} ${target}`.trim(), tone };
          }

          function estimatedTextWidth(text: string, nameLine: boolean) {
            let width = 0;
            for (const character of text) {
              if (character === ' ') width += 3.1;
              else if (/[MW@#%&]/.test(character)) width += 7.4;
              else if (/[A-Z0-9✓✕×÷+−]/.test(character)) width += 6.3;
              else if (/[ilI.,'`]/.test(character)) width += 3.2;
              else width += 5.5;
            }
            return width * (nameLine ? 1.06 : 1) + 2;
          }

          function estimateLabelSize(currency: NodeLabelView['currency'], name: string | null, effects: NodeLabelEffectView[]) {
            const widths = [
              ...(currency ? [estimatedTextWidth(currency.text, false) + (currency.hasIcon ? 15 : 0)] : []),
              ...(name ? [estimatedTextWidth(name, true)] : []),
              ...effects.map((effect) => estimatedTextWidth(effect.text, false)),
            ];
            const width = Math.max(24, Math.ceil(Math.max(...widths, 0)));
            const currencyHeight = currency ? 13 : 0;
            const nameHeight = name ? 14 : 0;
            const effectHeight = effects.length * 13;
            const sectionCount = Number(Boolean(currency)) + Number(Boolean(name)) + Number(effects.length > 0);
            const sectionGap = Math.max(0, sectionCount - 1) * 3;
            return { width, height: Math.max(1, currencyHeight + nameHeight + sectionGap + effectHeight) };
          }

          function expandRect(rect: Rect, amount: number): Rect {
            return { left: rect.left - amount, top: rect.top - amount, right: rect.right + amount, bottom: rect.bottom + amount };
          }

          function rectsOverlap(a: Rect, b: Rect) {
            return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
          }

          function rectCircleIntersects(rect: Rect, center: Point, radius: number) {
            const closestX = Math.max(rect.left, Math.min(center.x, rect.right));
            const closestY = Math.max(rect.top, Math.min(center.y, rect.bottom));
            return Math.hypot(center.x - closestX, center.y - closestY) < radius;
          }

          function pointInsideRect(point: Point, rect: Rect) {
            return point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom;
          }

          function orientation(a: Point, b: Point, c: Point) {
            const value = (b.y - a.y) * (c.x - b.x) - (b.x - a.x) * (c.y - b.y);
            if (Math.abs(value) < 1e-9) return 0;
            return value > 0 ? 1 : 2;
          }

          function onSegment(a: Point, b: Point, c: Point) {
            return b.x <= Math.max(a.x, c.x) + 1e-9
              && b.x + 1e-9 >= Math.min(a.x, c.x)
              && b.y <= Math.max(a.y, c.y) + 1e-9
              && b.y + 1e-9 >= Math.min(a.y, c.y);
          }

          function segmentsIntersect(a: Point, b: Point, c: Point, d: Point) {
            const o1 = orientation(a, b, c);
            const o2 = orientation(a, b, d);
            const o3 = orientation(c, d, a);
            const o4 = orientation(c, d, b);
            if (o1 !== o2 && o3 !== o4) return true;
            if (o1 === 0 && onSegment(a, c, b)) return true;
            if (o2 === 0 && onSegment(a, d, b)) return true;
            if (o3 === 0 && onSegment(c, a, d)) return true;
            return o4 === 0 && onSegment(c, b, d);
          }

          function segmentIntersectsRect(a: Point, b: Point, rect: Rect) {
            if (pointInsideRect(a, rect) || pointInsideRect(b, rect)) return true;
            const topLeft = { x: rect.left, y: rect.top };
            const topRight = { x: rect.right, y: rect.top };
            const bottomRight = { x: rect.right, y: rect.bottom };
            const bottomLeft = { x: rect.left, y: rect.bottom };
            return segmentsIntersect(a, b, topLeft, topRight)
              || segmentsIntersect(a, b, topRight, bottomRight)
              || segmentsIntersect(a, b, bottomRight, bottomLeft)
              || segmentsIntersect(a, b, bottomLeft, topLeft);
          }

          function spatialKey(x: number, y: number) {
            return `${x}:${y}`;
          }

          function cellRange(rect: Rect) {
            return {
              minX: Math.floor(rect.left / SPATIAL_CELL),
              maxX: Math.floor(rect.right / SPATIAL_CELL),
              minY: Math.floor(rect.top / SPATIAL_CELL),
              maxY: Math.floor(rect.bottom / SPATIAL_CELL),
            };
          }

          function addToSpatialIndex<T>(index: SpatialIndex<T>, rect: Rect, value: T) {
            const range = cellRange(rect);
            for (let x = range.minX; x <= range.maxX; x += 1) {
              for (let y = range.minY; y <= range.maxY; y += 1) {
                const key = spatialKey(x, y);
                const bucket = index.get(key);
                if (bucket) bucket.push(value);
                else index.set(key, [value]);
              }
            }
          }

          function addPointToSpatialIndex<T>(index: SpatialIndex<T>, point: Point, value: T) {
            const key = spatialKey(Math.floor(point.x / SPATIAL_CELL), Math.floor(point.y / SPATIAL_CELL));
            const bucket = index.get(key);
            if (bucket) bucket.push(value);
            else index.set(key, [value]);
          }

          function addSegmentToSpatialIndex<T>(index: SpatialIndex<T>, source: Point, target: Point, value: T) {
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / (SPATIAL_CELL / 2)));
            const touched = new Set<string>();
            for (let i = 0; i <= steps; i += 1) {
              const x = source.x + dx * (i / steps);
              const y = source.y + dy * (i / steps);
              const cellX = Math.floor(x / SPATIAL_CELL);
              const cellY = Math.floor(y / SPATIAL_CELL);
              for (let offsetX = -1; offsetX <= 1; offsetX += 1) {
                for (let offsetY = -1; offsetY <= 1; offsetY += 1) {
                  const key = spatialKey(cellX + offsetX, cellY + offsetY);
                  if (touched.has(key)) continue;
                  touched.add(key);
                  const bucket = index.get(key);
                  if (bucket) bucket.push(value);
                  else index.set(key, [value]);
                }
              }
            }
          }

          function querySpatialIndex<T>(index: SpatialIndex<T>, rect: Rect) {
            const range = cellRange(rect);
            const result = new Set<T>();
            for (let x = range.minX; x <= range.maxX; x += 1) {
              for (let y = range.minY; y <= range.maxY; y += 1) {
                const bucket = index.get(spatialKey(x, y));
                if (bucket) bucket.forEach((value) => result.add(value));
              }
            }
            return result;
          }

          function nodeCenter(node: NodeLabelInput): Point {
            return { x: node.position.x + NODE_SIZE / 2, y: node.position.y + NODE_SIZE / 2 };
          }

          function candidateRect(center: Point, width: number, height: number, direction: Direction): Rect {
            const halfWidth = width / 2;
            const halfHeight = height / 2;
            const rectangleRadiusAlongDirection = Math.abs(direction.x) * halfWidth + Math.abs(direction.y) * halfHeight;
            const distance = NODE_RADIUS + LABEL_GAP + rectangleRadiusAlongDirection;
            const labelCenter = { x: center.x + direction.x * distance, y: center.y + direction.y * distance };
            return { left: labelCenter.x - halfWidth, top: labelCenter.y - halfHeight, right: labelCenter.x + halfWidth, bottom: labelCenter.y + halfHeight };
          }

          export function buildNodeLabelLayout(
            nodes: NodeLabelInput[],
            edges: LayoutEdge[],
            options: { showCurrency: boolean; showNames: boolean; showStats: boolean },
          ): ReadonlyMap<string, NodeLabelView> {
            if (!options.showCurrency && !options.showNames && !options.showStats) return new Map();

            const centerMap = new Map(nodes.map((node) => [node.id, nodeCenter(node)]));
            const nodeIndex: SpatialIndex<NodeLabelInput> = new Map();
            for (const node of nodes) addPointToSpatialIndex(nodeIndex, centerMap.get(node.id)!, node);

            const edgeSegments = edges.flatMap((edge) => {
              const source = centerMap.get(edge.source);
              const target = centerMap.get(edge.target);
              return source && target ? [{ source, target }] : [];
            });
            const edgeIndex: SpatialIndex<(typeof edgeSegments)[number]> = new Map();
            for (const segment of edgeSegments) addSegmentToSpatialIndex(edgeIndex, segment.source, segment.target, segment);

            const degree = new Map<string, number>();
            for (const edge of edges) {
              degree.set(edge.source, (degree.get(edge.source) ?? 0) + 1);
              degree.set(edge.target, (degree.get(edge.target) ?? 0) + 1);
            }

            const prepared = nodes.flatMap((node) => {
              const currency = options.showCurrency && node.currency ? formatCurrency(node.currency) : null;
              const name = options.showNames && node.name.trim() ? node.name.trim() : null;
              const effects = options.showStats ? node.effects.map(formatEffect) : [];
              if (!currency && !name && effects.length === 0) return [];
              const size = estimateLabelSize(currency, name, effects);
              return [{ node, currency, name, effects, ...size }];
            }).sort((a, b) => {
              const constraintA = (degree.get(a.node.id) ?? 0) * 1000 + a.width + a.height;
              const constraintB = (degree.get(b.node.id) ?? 0) * 1000 + b.width + b.height;
              return constraintB - constraintA || a.node.id.localeCompare(b.node.id);
            });

            const result = new Map<string, NodeLabelView>();
            const placedIndex: SpatialIndex<Rect> = new Map();

            for (const { node, currency, name, effects, width, height } of prepared) {
              const center = centerMap.get(node.id)!;
              let best: { rect: Rect; direction: Direction; score: number } | null = null;

              for (const direction of DIRECTIONS) {
                const rect = candidateRect(center, width, height, direction);
                let score = direction.bias;
                const nodeCollisionRect = expandRect(rect, NODE_CLEARANCE);
                const edgeCollisionRect = expandRect(rect, EDGE_CLEARANCE);
                const labelCollisionRect = expandRect(rect, LABEL_CLEARANCE);

                const nearbyNodes = querySpatialIndex(nodeIndex, expandRect(rect, NODE_RADIUS + 12));
                for (const otherNode of nearbyNodes) {
                  if (otherNode.id === node.id) continue;
                  const otherCenter = centerMap.get(otherNode.id)!;
                  if (rectCircleIntersects(nodeCollisionRect, otherCenter, NODE_RADIUS)) score += 1_000_000;
                  else if (rectCircleIntersects(expandRect(rect, 12), otherCenter, NODE_RADIUS)) score += 300;
                }

                const nearbyEdges = querySpatialIndex(edgeIndex, expandRect(rect, 12));
                for (const segment of nearbyEdges) {
                  if (segmentIntersectsRect(segment.source, segment.target, edgeCollisionRect)) score += 100_000;
                  else if (segmentIntersectsRect(segment.source, segment.target, expandRect(rect, 10))) score += 120;
                }

                const nearbyLabels = querySpatialIndex(placedIndex, expandRect(labelCollisionRect, LABEL_CLEARANCE));
                for (const placed of nearbyLabels) {
                  if (rectsOverlap(labelCollisionRect, expandRect(placed, LABEL_CLEARANCE))) score += 500_000;
                }

                if (!best || score < best.score) best = { rect, direction, score };
              }

              if (!best) continue;
              addToSpatialIndex(placedIndex, expandRect(best.rect, LABEL_CLEARANCE), best.rect);
              result.set(node.id, {
                left: best.rect.left - node.position.x,
                top: best.rect.top - node.position.y,
                width,
                align: best.direction.align,
                currency,
                name,
                effects,
              });
            }

            return result;
          }
          EOF

          cat > src/playtest.ts <<'EOF'
          export type PlaytestStatType = 'number' | 'boolean';

          export type PlaytestStat = {
            id: string;
            type: PlaytestStatType;
            baseValue: number | boolean;
          };

          export type PlaytestUpgrade = {
            statId: string;
            operator: 'add' | 'subtract' | 'multiply' | 'divide' | 'set';
            value: number | boolean;
          };

          export type PlaytestNode = {
            id: string;
            data: { upgrades: PlaytestUpgrade[] };
          };

          export type PlaytestEdge = { source: string; target: string };

          const incomingEdgeCache = new WeakMap<readonly PlaytestEdge[], ReadonlyMap<string, readonly string[]>>();
          const outgoingEdgeCache = new WeakMap<readonly PlaytestEdge[], ReadonlyMap<string, readonly string[]>>();

          function endpointIndex(edges: readonly PlaytestEdge[], direction: 'incoming' | 'outgoing') {
            const cache = direction === 'incoming' ? incomingEdgeCache : outgoingEdgeCache;
            const cached = cache.get(edges);
            if (cached) return cached;
            const index = new Map<string, string[]>();
            for (const edge of edges) {
              const key = direction === 'incoming' ? edge.target : edge.source;
              const value = direction === 'incoming' ? edge.source : edge.target;
              const list = index.get(key);
              if (list) list.push(value);
              else index.set(key, [value]);
            }
            cache.set(edges, index);
            return index;
          }

          export function canUnlockPlaytestNode(nodeId: string, unlockedNodeIds: ReadonlySet<string>, edges: readonly PlaytestEdge[]) {
            if (unlockedNodeIds.has(nodeId)) return false;
            return (endpointIndex(edges, 'incoming').get(nodeId) ?? []).every((source) => unlockedNodeIds.has(source));
          }

          export function canLockPlaytestNode(nodeId: string, unlockedNodeIds: ReadonlySet<string>, edges: readonly PlaytestEdge[]) {
            if (!unlockedNodeIds.has(nodeId)) return false;
            return !(endpointIndex(edges, 'outgoing').get(nodeId) ?? []).some((target) => unlockedNodeIds.has(target));
          }

          export function simulateStatValues(stats: readonly PlaytestStat[], nodes: readonly PlaytestNode[], unlockedNodeIds: ReadonlySet<string>) {
            const effectsByStat = new Map<string, PlaytestUpgrade[]>();
            nodes.forEach((node) => {
              if (!unlockedNodeIds.has(node.id)) return;
              node.data.upgrades.forEach((upgrade) => {
                const effects = effectsByStat.get(upgrade.statId) ?? [];
                effects.push(upgrade);
                effectsByStat.set(upgrade.statId, effects);
              });
            });

            return new Map<string, number | boolean>(stats.map((stat) => {
              const effects = effectsByStat.get(stat.id) ?? [];
              if (stat.type === 'boolean') {
                const setEffect = effects.find((effect) => effect.operator === 'set');
                return [stat.id, setEffect ? Boolean(setEffect.value) : Boolean(stat.baseValue)];
              }
              let flatAdditions = 0;
              let flatSubtractions = 0;
              let multiplierDelta = 0;
              let divisorDelta = 0;
              effects.forEach((effect) => {
                const value = Number(effect.value);
                if (!Number.isFinite(value)) return;
                if (effect.operator === 'add') flatAdditions += value;
                else if (effect.operator === 'subtract') flatSubtractions += value;
                else if (effect.operator === 'multiply') multiplierDelta += value - 1;
                else if (effect.operator === 'divide') divisorDelta += value - 1;
              });
              const base = typeof stat.baseValue === 'number' && Number.isFinite(stat.baseValue) ? stat.baseValue : 0;
              const numerator = (base + flatAdditions - flatSubtractions) * (1 + multiplierDelta);
              const denominator = 1 + divisorDelta;
              return [stat.id, numerator / denominator];
            }));
          }
          EOF

