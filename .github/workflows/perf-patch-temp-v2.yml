          .flow-panel.is-low-detail-zoom .skill-node-label-currency {
            display: none;
          }
          .flow-panel.is-minimal-detail-zoom .skill-node-label,
          .flow-panel.is-minimal-detail-zoom .skill-node-secondary-icon,
