          replace_once(app,
          "      nodes.map((node) => {\n",
          "      labelLayoutNodes.map((node) => {\n")
          replace_once(app,
          "  }, [currencies, edges, iconIds, nodes, showNodeCurrency, showNodeNames, showNodeStats, statMap]);\n\n\n  const renderedEdges",
          "  }, [currencies, edges, iconIds, labelLayoutNodes, showNodeCurrency, showNodeNames, showNodeStats, statMap]);\n\n\n  const renderedEdges")

          replace_once(app,
          "  const playtestNodes = useMemo<SkillFlowNode[]>(() => nodes.map((node) => ({\n    ...node,\n    selected: false,\n    draggable: false,\n    selectable: false,\n  })), [nodes]);\n\n  const playtestNodeStates = useMemo<ReadonlyMap<string, PlaytestNodeState>>(() =>\n    new Map(nodes.map((node) => [\n      node.id,\n      unlockedNodeIds.has(node.id)\n        ? 'unlocked'\n        : canUnlockPlaytestNode(node.id, unlockedNodeIds, edges)\n          ? 'available'\n          : 'locked',\n    ] as const)),\n  [edges, nodes, unlockedNodeIds]);\n\n  const simulatedStats = useMemo(() =>\n    simulateStatValues(stats, nodes, unlockedNodeIds),\n  [nodes, stats, unlockedNodeIds]);\n\n  const playtestCurrencyTotals = useMemo(() => {\n    const totals = new Map<string, number>(currencies.map((currency) => [currency.id, 0]));\n    nodes.forEach((node) => {\n      if (!unlockedNodeIds.has(node.id)) return;\n      const { currencyId, amount } = node.data.cost;\n      if (!currencyId || !Number.isFinite(amount)) return;\n      totals.set(currencyId, (totals.get(currencyId) ?? 0) + amount);\n    });\n    return totals;\n  }, [currencies, nodes, unlockedNodeIds]);\n",
          "  const playtestNodes = useMemo<SkillFlowNode[]>(() => {\n    if (!isPlaytest) return nodes;\n    return nodes.map((node) => ({\n      ...node,\n      selected: false,\n      draggable: false,\n      selectable: false,\n    }));\n  }, [isPlaytest, nodes]);\n\n  const playtestNodeStates = useMemo<ReadonlyMap<string, PlaytestNodeState>>(() => {\n    if (!isPlaytest) return EMPTY_PLAYTEST_NODE_STATES;\n    return new Map(nodes.map((node) => [\n      node.id,\n      unlockedNodeIds.has(node.id)\n        ? 'unlocked'\n        : canUnlockPlaytestNode(node.id, unlockedNodeIds, edges)\n          ? 'available'\n          : 'locked',\n    ] as const));\n  }, [edges, isPlaytest, nodes, unlockedNodeIds]);\n\n  const simulatedStats = useMemo(() => {\n    if (!isPlaytest) return new Map<string, number | boolean>();\n    return simulateStatValues(stats, nodes, unlockedNodeIds);\n  }, [isPlaytest, nodes, stats, unlockedNodeIds]);\n\n  const playtestCurrencyTotals = useMemo(() => {\n    if (!isPlaytest) return new Map<string, number>();\n    const totals = new Map<string, number>(currencies.map((currency) => [currency.id, 0]));\n    nodes.forEach((node) => {\n      if (!unlockedNodeIds.has(node.id)) return;\n      const { currencyId, amount } = node.data.cost;\n      if (!currencyId || !Number.isFinite(amount)) return;\n      totals.set(currencyId, (totals.get(currencyId) ?? 0) + amount);\n    });\n    return totals;\n  }, [currencies, isPlaytest, nodes, unlockedNodeIds]);\n")

          replace_once(app,
          "                        const issue = edgeIssue(node.id, selectedNode.id, edges);\n",
          "                        const issue = prerequisiteIssueForSource(node.id);\n")

          history = 'src/history.ts'
          replace_once(history,
          "function recordProject(raw: string) {\n  const next = normalizeProject(raw);\n",
          "function recordProject(raw: unknown) {\n  const next = normalizeProject(raw);\n")
          replace_once(history,
          "export function recordHistoryProject(project: unknown) {\n  try {\n    recordProject(typeof project === 'string' ? project : JSON.stringify(project));\n  } catch {\n    // Ignore transient editor state that is not serializable.\n  }\n}\n",
          "export function recordHistoryProject(project: unknown) {\n  try {\n    if (nodeDragActive && project && typeof project === 'object') {\n      // React Flow emits many immutable node arrays during a drag. Keep only the\n      // newest frame by reference and normalize/diff once after pointer-up.\n      pendingDragProject = project as CanonicalProject;\n      latestEditorProject = project as CanonicalProject;\n      return;\n    }\n    recordProject(project);\n  } catch {\n    // Ignore transient editor state that is not serializable.\n  }\n}\n")
          replace_once(history,
          "  recordProject(JSON.stringify(project));\n",
          "  recordProject(project);\n")

          main = 'src/main.tsx'
          replace_once(main,
          "import './chromeRuntime';\n",
          "import './chromeRuntime';\nimport './performanceRuntime';\n")
          PY

          cat > src/graphIndex.ts <<'EOF'
          export type DirectedEdge = { source: string; target: string };

          export function buildPrerequisiteIssueChecker(
            targetId: string | null,
            edges: readonly DirectedEdge[],
          ) {
            if (!targetId) return (_sourceId: string) => null as string | null;

            const directSources = new Set<string>();
            const outgoing = new Map<string, string[]>();
            for (const edge of edges) {
              if (edge.target === targetId) directSources.add(edge.source);
              const list = outgoing.get(edge.source);
              if (list) list.push(edge.target);
              else outgoing.set(edge.source, [edge.target]);
            }

            const descendants = new Set<string>();
            const stack = [...(outgoing.get(targetId) ?? [])];
            while (stack.length > 0) {
              const current = stack.pop()!;
              if (descendants.has(current)) continue;
              descendants.add(current);
              const next = outgoing.get(current);
              if (next) stack.push(...next);
            }

            return (sourceId: string): string | null => {
              if (sourceId === targetId) return 'A skill cannot unlock itself.';
              if (directSources.has(sourceId)) return 'That prerequisite link already exists.';
              if (descendants.has(sourceId)) return 'That link would create a recursive loop.';
              return null;
            };
          }
          EOF

          cat > src/performanceRuntime.ts <<'EOF'
          const LOW_DETAIL_ZOOM = 0.2;
          const MINIMAL_DETAIL_ZOOM = 0.1;

          function zoomFromTransform(transform: string) {
            const scale = transform.match(/scale\(([-+\d.eE]+)\)/)?.[1];
            if (scale) return Number(scale);
            const matrix = transform.match(/^matrix\(([^)]+)\)$/)?.[1];
            if (matrix) {
              const first = Number(matrix.split(',')[0]);
              if (Number.isFinite(first)) return Math.abs(first);
            }
            return 1;
          }

          function syncViewportDetail(viewport: HTMLElement) {
            const panel = viewport.closest<HTMLElement>('.flow-panel');
            if (!panel) return;
            const zoom = zoomFromTransform(viewport.style.transform);
            panel.classList.toggle('is-low-detail-zoom', zoom < LOW_DETAIL_ZOOM);
            panel.classList.toggle('is-minimal-detail-zoom', zoom < MINIMAL_DETAIL_ZOOM);
          }

          function observeViewport(viewport: HTMLElement) {
            if (viewport.dataset.performanceObserved === 'true') return;
            viewport.dataset.performanceObserved = 'true';
            syncViewportDetail(viewport);
            new MutationObserver(() => syncViewportDetail(viewport)).observe(viewport, {
              attributes: true,
              attributeFilter: ['style'],
            });
          }

          function scan() {
            document.querySelectorAll<HTMLElement>('.flow-panel .react-flow__viewport').forEach(observeViewport);
          }

          scan();
          new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
          EOF

          cat >> src/nodeLabels.css <<'EOF'

          /* At extreme zoom-out these details are below readable size but expensive to paint. */
