name: Apply performance patch v2
run-name: Apply skill tree performance patch v2

on:
  push:
    branches: [perf/skill-tree-interactions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/skill-tree-interactions
      - name: Apply targeted performance patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          app = 'src/App.tsx'
          replace_once(app,
          "import { recommendUpgradeStat } from './statUpgradeRecommendation';\n",
          "import { recommendUpgradeStat } from './statUpgradeRecommendation';\nimport { buildPrerequisiteIssueChecker } from './graphIndex';\n")

