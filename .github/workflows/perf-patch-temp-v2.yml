          replace_once(app,
          "  const incomingEdges = selectedNodeId ? edges.filter((edge) => edge.target === selectedNodeId) : [];\n  const selectedCurrency = currencies.find((currency) => currency.id === selectedNode?.data.cost.currencyId);\n",
