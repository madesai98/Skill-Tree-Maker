name: Validate build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Smoke test production output
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/skill-tree-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Skill-Tree-Maker/ -o /tmp/skill-tree-index.html; then
              break
            fi
            sleep 0.5
          done
          test -s /tmp/skill-tree-index.html
          grep -q '/Skill-Tree-Maker/assets/' /tmp/skill-tree-index.html
          ASSET=$(grep -oE '/Skill-Tree-Maker/assets/[^"'"' ]+' /tmp/skill-tree-index.html | head -n 1)
          test -n "$ASSET"
          curl --fail --silent --show-error "http://127.0.0.1:4173${ASSET}" -o /dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-validation:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/verify-online-main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
