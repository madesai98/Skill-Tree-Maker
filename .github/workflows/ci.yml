name: Validate build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/remove-perk-costs
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply perk cost removal
        run: |
          python scripts/remove-perk-costs.py
          python scripts/fix-perk-state.py

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Smoke test production output
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/skill-tree-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Skill-Tree-Maker/ -o /tmp/skill-tree-index.html; then
              READY=1
              break
            fi
            sleep 0.5
          done
          test "$READY" = "1"
          test -s /tmp/skill-tree-index.html
          grep -q '/Skill-Tree-Maker/assets/' /tmp/skill-tree-index.html

          python - <<'PY' > /tmp/skill-tree-asset-path
          from pathlib import Path
          import re
          html = Path('/tmp/skill-tree-index.html').read_text()
          match = re.search(r'["\x27](/Skill-Tree-Maker/assets/[^"\x27]+)["\x27]', html)
          if not match:
              raise SystemExit('No built asset URL found in preview HTML')
          print(match.group(1))
          PY

          ASSET=$(cat /tmp/skill-tree-asset-path)
          test -n "$ASSET"
          curl --fail --silent --show-error "http://127.0.0.1:4173${ASSET}" -o /dev/null

      - name: Commit validated implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f scripts/remove-perk-costs.py scripts/fix-perk-state.py .github/workflows/apply-remove-perk-costs.yml
          git add src/App.tsx src/PerksView.tsx .github/workflows/ci.yml
          git commit -m "Remove currency costs from perks"
          git push origin HEAD:feature/remove-perk-costs
