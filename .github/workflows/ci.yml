name: Validate build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/skill-node-icon-ui
          fetch-depth: 0

      - name: Apply skill node appearance patch
        shell: bash
        run: |
          awk '
            /python - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/temp-skill-node-icon-ui.yml > /tmp/skill-node-patch.py
          test -s /tmp/skill-node-patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/skill-node-patch.py')
          text = path.read_text()
          strict = "replace_once(old_block, new_block, 'node visuals and labels block')"
          loose = "match = re.search(r\"  const incomingEdges = selectedNodeId.*?(?=\\n  const renderedEdges = useMemo)\", text, re.S)\nif not match:\n    raise SystemExit('missing node visuals and labels region')\ntext = text[:match.start()] + new_block.rstrip() + '\\n\\n' + text[match.end():]"
          if strict not in text:
              raise SystemExit('missing strict node-label replacement in patch script')
          path.write_text(text.replace(strict, loose, 1))
          PY
          python /tmp/skill-node-patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/App.tsx src/nodeLabelLayout.ts src/styles.css src/nodeLabels.css src/projectData.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Use icon pool metadata in skill tree nodes"
            git push origin HEAD:feat/skill-node-icon-ui
          fi

      - name: Smoke test production output
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/skill-tree-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Skill-Tree-Maker/ -o /tmp/skill-tree-index.html; then
              READY=1
              break
            fi
            sleep 0.5
          done
          test "$READY" = "1"
          test -s /tmp/skill-tree-index.html
          grep -q '/Skill-Tree-Maker/assets/' /tmp/skill-tree-index.html

          python - <<'PY' > /tmp/skill-tree-asset-path
          from pathlib import Path
          import re
          html = Path('/tmp/skill-tree-index.html').read_text()
          match = re.search(r'["\x27](/Skill-Tree-Maker/assets/[^"\x27]+)["\x27]', html)
          if not match:
              raise SystemExit('No built asset URL found in preview HTML')
          print(match.group(1))
          PY

          ASSET=$(cat /tmp/skill-tree-asset-path)
          test -n "$ASSET"
          curl --fail --silent --show-error "http://127.0.0.1:4173${ASSET}" -o /dev/null