name: Apply render isolation patch
run-name: Apply render isolation performance patch

on:
  push:
    branches: [perf/skill-tree-render-isolation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/skill-tree-render-isolation
      - name: Apply render isolation optimizations
        run: python .github/render-isolation-patch.py
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit optimized source and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/render-isolation-temp.yml .github/render-isolation-patch.py
          git add src/App.tsx
          git commit -m "Isolate graph renders during node edits"
          git push origin HEAD:perf/skill-tree-render-isolation
