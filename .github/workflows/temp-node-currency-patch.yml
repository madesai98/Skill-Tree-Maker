name: Temporary node currency patch

on:
  push:
    branches: [feat/node-currency-labels]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/node-currency-labels
          fetch-depth: 0

      - name: Apply currency label implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/App.tsx',
              '''        >\n          {label.name && <div className="skill-node-label-name">{label.name}</div>}\n''',
              '''        >\n          {label.currency && <div className="skill-node-label-currency">{label.currency}</div>}\n          {label.name && <div className="skill-node-label-name">{label.name}</div>}\n''',
          )

          replace_once(
              'src/App.tsx',
              '''  const [connectionChoice, setConnectionChoice] = useState('');\n  const [showNodeNames, setShowNodeNames] = useState(true);\n''',
              '''  const [connectionChoice, setConnectionChoice] = useState('');\n  const [showNodeCurrency, setShowNodeCurrency] = useState(true);\n  const [showNodeNames, setShowNodeNames] = useState(true);\n''',
          )

          replace_once(
              'src/App.tsx',
              '''  const nodeLabels = useMemo(() => {\n    const statMap = new Map(stats.map((stat) => [stat.id, stat]));\n    return buildNodeLabelLayout(\n      nodes.map((node) => ({\n        id: node.id,\n        position: node.position,\n        name: node.data.name,\n        effects: node.data.upgrades.flatMap((upgrade) => {\n          const stat = statMap.get(upgrade.statId);\n          if (!stat) return [];\n          return [{\n            operator: upgrade.operator,\n            value: upgrade.value,\n            groupName: stat.groupName,\n            statName: stat.name,\n          }];\n        }),\n      })),\n      edges,\n      { showNames: showNodeNames, showStats: showNodeStats },\n    );\n  }, [edges, nodes, showNodeNames, showNodeStats, stats]);\n''',
              '''  const nodeLabels = useMemo(() => {\n    const statMap = new Map(stats.map((stat) => [stat.id, stat]));\n    const currencyMap = new Map(currencies.map((currency) => [currency.id, currency]));\n    return buildNodeLabelLayout(\n      nodes.map((node) => {\n        const currency = currencyMap.get(node.data.cost.currencyId);\n        return {\n          id: node.id,\n          position: node.position,\n          name: node.data.name,\n          currency: currency ? { symbol: currency.symbol, amount: node.data.cost.amount } : null,\n          effects: node.data.upgrades.flatMap((upgrade) => {\n            const stat = statMap.get(upgrade.statId);\n            if (!stat) return [];\n            return [{\n              operator: upgrade.operator,\n              value: upgrade.value,\n              groupName: stat.groupName,\n              statName: stat.name,\n            }];\n          }),\n        };\n      }),\n      edges,\n      { showCurrency: showNodeCurrency, showNames: showNodeNames, showStats: showNodeStats },\n    );\n  }, [currencies, edges, nodes, showNodeCurrency, showNodeNames, showNodeStats, stats]);\n''',
          )

          replace_once(
              'src/App.tsx',
              '''            <div className="canvas-display-toolbar" aria-label="Node display options">\n              <button\n                className={`canvas-icon-toggle${showNodeNames ? ' is-active' : ''}`}\n''',
              '''            <div className="canvas-display-toolbar" aria-label="Node display options">\n              <button\n                className={`canvas-icon-toggle${showNodeCurrency ? ' is-active' : ''}`}\n                type="button"\n                aria-label="Toggle node currency costs"\n                aria-pressed={showNodeCurrency}\n                title="Toggle node currency costs"\n                onClick={() => setShowNodeCurrency((current) => !current)}\n              >\n                <Icon name="currency" />\n              </button>\n              <button\n                className={`canvas-icon-toggle${showNodeNames ? ' is-active' : ''}`}\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''export type NodeLabelInput = {\n  id: string;\n  position: { x: number; y: number };\n  name: string;\n  effects: NodeLabelEffectInput[];\n};\n''',
              '''export type NodeLabelInput = {\n  id: string;\n  position: { x: number; y: number };\n  name: string;\n  currency: { symbol: string; amount: number } | null;\n  effects: NodeLabelEffectInput[];\n};\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''export type NodeLabelView = {\n  left: number;\n  top: number;\n  width: number;\n  align: 'left' | 'center' | 'right';\n  name: string | null;\n  effects: NodeLabelEffectView[];\n};\n''',
              '''export type NodeLabelView = {\n  left: number;\n  top: number;\n  width: number;\n  align: 'left' | 'center' | 'right';\n  currency: string | null;\n  name: string | null;\n  effects: NodeLabelEffectView[];\n};\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''function statTarget(groupName: string, statName: string) {\n''',
              '''function formatCurrency(currency: NonNullable<NodeLabelInput['currency']>) {\n  const symbol = currency.symbol.trim();\n  const amount = formatNumber(currency.amount);\n  return `${symbol} ${amount}`.trim();\n}\n\nfunction statTarget(groupName: string, statName: string) {\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''function estimateLabelSize(name: string | null, effects: NodeLabelEffectView[]) {\n  const widths = [\n    ...(name ? [estimatedTextWidth(name, true)] : []),\n    ...effects.map((effect) => estimatedTextWidth(effect.text, false)),\n  ];\n  const width = Math.max(24, Math.ceil(Math.max(...widths, 0)));\n  const nameHeight = name ? 14 : 0;\n  const effectHeight = effects.length * 13;\n  const sectionGap = name && effects.length ? 3 : 0;\n  return { width, height: Math.max(1, nameHeight + sectionGap + effectHeight) };\n}\n''',
              '''function estimateLabelSize(currency: string | null, name: string | null, effects: NodeLabelEffectView[]) {\n  const widths = [\n    ...(currency ? [estimatedTextWidth(currency, false)] : []),\n    ...(name ? [estimatedTextWidth(name, true)] : []),\n    ...effects.map((effect) => estimatedTextWidth(effect.text, false)),\n  ];\n  const width = Math.max(24, Math.ceil(Math.max(...widths, 0)));\n  const currencyHeight = currency ? 13 : 0;\n  const nameHeight = name ? 14 : 0;\n  const effectHeight = effects.length * 13;\n  const sectionCount = Number(Boolean(currency)) + Number(Boolean(name)) + Number(effects.length > 0);\n  const sectionGap = Math.max(0, sectionCount - 1) * 3;\n  return { width, height: Math.max(1, currencyHeight + nameHeight + sectionGap + effectHeight) };\n}\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''  options: { showNames: boolean; showStats: boolean },\n): ReadonlyMap<string, NodeLabelView> {\n  if (!options.showNames && !options.showStats) return new Map();\n''',
              '''  options: { showCurrency: boolean; showNames: boolean; showStats: boolean },\n): ReadonlyMap<string, NodeLabelView> {\n  if (!options.showCurrency && !options.showNames && !options.showStats) return new Map();\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''  const prepared = nodes.flatMap((node) => {\n    const name = options.showNames && node.name.trim() ? node.name.trim() : null;\n    const effects = options.showStats ? node.effects.map(formatEffect) : [];\n    if (!name && effects.length === 0) return [];\n    const size = estimateLabelSize(name, effects);\n    return [{ node, name, effects, ...size }];\n  }).sort((a, b) => {\n''',
              '''  const prepared = nodes.flatMap((node) => {\n    const currency = options.showCurrency && node.currency ? formatCurrency(node.currency) : null;\n    const name = options.showNames && node.name.trim() ? node.name.trim() : null;\n    const effects = options.showStats ? node.effects.map(formatEffect) : [];\n    if (!currency && !name && effects.length === 0) return [];\n    const size = estimateLabelSize(currency, name, effects);\n    return [{ node, currency, name, effects, ...size }];\n  }).sort((a, b) => {\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''  for (const { node, name, effects, width, height } of prepared) {\n''',
              '''  for (const { node, currency, name, effects, width, height } of prepared) {\n''',
          )

          replace_once(
              'src/nodeLabelLayout.ts',
              '''      align: best.direction.align,\n      name,\n      effects,\n''',
              '''      align: best.direction.align,\n      currency,\n      name,\n      effects,\n''',
          )

          replace_once(
              'src/nodeLabels.css',
              '''.skill-node-label-name {\n''',
              '''.skill-node-label-currency {\n  overflow: visible;\n  color: #cbd3dc;\n  font-size: 10px;\n  font-weight: 720;\n  white-space: nowrap;\n}\n.skill-node-label-name {\n''',
          )
          PY

      - name: Validate production build
        run: |
          npm install
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx src/nodeLabelLayout.ts src/nodeLabels.css
          git diff --cached --quiet && exit 1
          git commit -m "Display node currency costs"
          git push origin HEAD:feat/node-currency-labels
